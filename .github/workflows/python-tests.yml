name: Python quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall .

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy exemplos desafios

      - name: Measure line and branch coverage
        run: >-
          python -m pytest
          --cov=exemplos
          --cov=desafios
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Publish coverage summary
        shell: bash
        run: |
          coverage_total="$(python -m coverage report --format=total)"
          {
            echo "## Test coverage"
            echo
            echo "Combined line and branch coverage: **${coverage_total}%**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-3.14
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall .

      - name: Run tests
        run: python -m pytest -v
